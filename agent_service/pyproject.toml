[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "creality-agent-service"
version = "0.1.0"
description = "Local durable API and MCP tools for agent-directed Creality printing"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.142,<0.143", "uvicorn>=0.54,<0.55", "httpx>=0.28,<0.29", "mcp>=2.3,<2.4", "pillow>=11,<13", "numpy>=2,<3", "python-multipart>=0.0.20,<0.1", "defusedxml>=0.7,<0.8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[project.scripts]
creality-agent = "creality_agent.cli:main"
creality-agent-mcp = "creality_agent.mcp_server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.hatch.build.targets.wheel]
packages = ["src/creality_agent"]
